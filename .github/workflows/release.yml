name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            extra-cmake-modules \
            libarchive-dev \
            libqrencode-dev \
            libgamemode-dev \
            libtomlplusplus-dev \
            libcmark-dev \
            zlib1g-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-networkauth-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DLAUNCHER_QT_VERSION_MAJOR=6

      - name: Build
        run: cmake --build build --target prismlauncher -j2

      - name: Package
        run: |
          mkdir -p dist
          cp build/prismlauncher dist/prismlauncher-linux-x86_64
          chmod +x dist/prismlauncher-linux-x86_64
          tar -czf dist/prismlauncher-linux-x86_64.tar.gz -C dist prismlauncher-linux-x86_64
          sha256sum dist/prismlauncher-linux-x86_64 dist/prismlauncher-linux-x86_64.tar.gz > dist/SHA256SUMS

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/prismlauncher-linux-x86_64
            dist/prismlauncher-linux-x86_64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-linux-x86_64
          path: |
            dist/prismlauncher-linux-x86_64
            dist/prismlauncher-linux-x86_64.tar.gz
            dist/SHA256SUMS
