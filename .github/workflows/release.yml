name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      APP_NAME: PrismLauncher-Horizon
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            extra-cmake-modules \
            libarchive-dev \
            libqrencode-dev \
            gamemode-dev \
            libtomlplusplus-dev \
            libcmark-dev \
            cmark \
            zlib1g-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-networkauth-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxi-dev \
            libxcb1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja extra-cmake-modules qt@6 libarchive qrencode cmark tomlplusplus

      - name: Install Qt (Windows only)
        if: runner.os == 'Windows'
        run: |
          python -m pip install aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt
        shell: pwsh

      - name: Install vcpkg dependencies (Windows only)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_ROOT = 'C:\vcpkg'
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows
        shell: pwsh

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="/usr" \
              -DLAUNCHER_QT_VERSION_MAJOR=6 \
              -DLAUNCHER_BUILD_PLATFORM=linux-x86_64
          else
            PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/libarchive/lib/pkgconfig:$PKG_CONFIG_PATH" \
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6;/opt/homebrew" \
              -DLAUNCHER_QT_VERSION_MAJOR=6 \
              -DLAUNCHER_BUILD_PLATFORM=macos
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64" `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DLAUNCHER_QT_VERSION_MAJOR=6 `
            -DLAUNCHER_BUILD_PLATFORM=windows-x86_64
        shell: pwsh

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --target prismlauncher -j2

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --target prismlauncher --config Release
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/prismlauncher dist/prismlauncher-linux-x86_64
          chmod +x dist/prismlauncher-linux-x86_64
          tar -czf dist/prismlauncher-linux-x86_64.tar.gz -C dist prismlauncher-linux-x86_64
          sha256sum dist/prismlauncher-linux-x86_64 dist/prismlauncher-linux-x86_64.tar.gz > dist/SHA256SUMS

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp build/prismlauncher dist/prismlauncher-macos
          chmod +x dist/prismlauncher-macos
          /opt/homebrew/opt/qt@6/bin/macdeployqt dist/prismlauncher-macos 2>/dev/null || true
          tar -czf dist/prismlauncher-macos.tar.gz -C dist prismlauncher-macos
          sha256sum dist/prismlauncher-macos dist/prismlauncher-macos.tar.gz > dist/SHA256SUMS

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $dist = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\Release\prismlauncher.exe "$dist\prismlauncher-windows-x86_64.exe"
          & "C:\Qt\6.8.3\msvc2022_64\bin\windeployqt.exe" "$dist\prismlauncher-windows-x86_64.exe" 2>$null
          Compress-Archive -Path "$dist\prismlauncher-windows-x86_64.exe","$dist\*.dll" -DestinationPath "$dist\prismlauncher-windows-x86_64.zip" -Force
          cd $dist
          sha256sum prismlauncher-windows-x86_64.exe > SHA256SUMS
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismlauncher-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
